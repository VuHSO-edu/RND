<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sơn Son Chu Sa) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2222"/>
      <stop offset="40%" stop-color="#8B1E1E"/>
      <stop offset="100%" stop-color="#5E1111"/>
    </linearGradient>

    <!-- Metallic Gold Gradient (Thếp Vàng Hoàng Gia) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#997514"/>
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B1E1E" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge / Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#shieldShadow)"/>

  <!-- Inner Bronze Drum Decorative Ring Patterns -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.65"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85"/>
  <circle cx="64" cy="64" r="38" fill="url(#sunGlow)"/>

  <!-- Stylized Dong Son Bronze Drum Star Rays (Trống Đồng Đông Sơn) -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5">
    <line x1="64" y1="23" x2="64" y2="105"/>
    <line x1="23" y1="64" x2="105" y2="64"/>
    <line x1="35" y1="35" x2="93" y2="93"/>
    <line x1="35" y1="93" x2="93" y2="35"/>
  </g>

  <!-- Central "DS" Monogram for Di Sản Việt Nam -->
  <text x="64" y="75" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="44" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        stroke="#4A0C0C" 
        stroke-width="1"
        letter-spacing="1"
        style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.55));">
    DS
  </text>
  
  <!-- Subtle Royal Lotus / Golden Accent Arc -->
  <path d="M 50 88 Q 64 93 78 88" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="90.5" r="2.2" fill="url(#goldGrad)"/>
</svg>
